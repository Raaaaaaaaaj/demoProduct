<div class="row g-4 align-items-end pt-5">
  <!-- Search -->
  <div class="col-lg-12 col-md-6">
    <label class="form-label fw-semibold"> Search Product </label>
    <input
      type="text"
      class="form-control"
      placeholder="Search by product name"
      [formControl]="searchControl"
    />
  </div>

  <!-- Min Price -->
  <div class="col-lg-12">
    <div class="row">
      <div class="col-lg-6 col-md-3">
        <label class="form-label fw-semibold"> Min Price </label>
        <input type="number" class="form-control w-full" placeholder="₹0" [(ngModel)]="minPrice" />
      </div>
      <!-- Max Price -->
      <div class="col-lg-6 col-md-3">
        <label class="form-label fw-semibold"> Max Price </label>
        <input
          type="number"
          class="form-control w-full"
          placeholder="₹5000"
          [max]="Max_Price"
          [(ngModel)]="maxPrice"
        />
      </div>
    </div>
  </div>

  <!-- Sort -->
  <div class="col-lg-12 col-md-6">
    <label class="form-label fw-semibold"> Sort By </label>
    <select class="form-select" [(ngModel)]="sortBy">
      <option value="newest" selected>Newest</option>
      <option value="priceAsc">Price: Low to High</option>
      <option value="priceDesc">Price: High to Low</option>
      <!-- <option value="rating">Highest Rated</option> -->
    </select>
  </div>

  <div class="col-lg-12 col-md-6">
    <div class="row align-items-center">
      <div class="col-lg-3">
        <label class="form-label fw-semibold mb-0"> Price Range </label>
      </div>

      <div class="col-lg-9">
        <input 
          type="range" 
          class="form-range" 
          min="0" 
          [max]="Max_Price" 
          [(ngModel)]="maxPrice" 
        />
        <div class="d-flex justify-content-between small text-muted">
          <span>₹{{minPrice}}</span>
          <span>₹{{maxPrice}}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<hr class="my-4" />

<!-- Clear -->
<div class="col-lg-12 col-md-6 d-grid">
  <button class="btn btn-outline-secondary border-danger">Clear</button>
</div>
