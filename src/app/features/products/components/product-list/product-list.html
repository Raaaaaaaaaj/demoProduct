<div class="row g-3">
  @for (product of displayProducts; track product.id) {
    <div class="col-4">
      <div class="card h-100 border-0 shadow-sm rounded-4">
        <!-- Product Image -->
        <!-- <img
          src="https://images.unsplash.com/photo-1609692814858-f7cd2f0afa4f?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          class="card-img-top rounded-top-4"
          alt="Product"
        /> -->

        <div class="card-body d-flex flex-column">
          <!-- Product Name -->
          <h5 class="card-title fw-semibold mb-2">
            {{ product.name }}
          </h5>

          <div class="d-flex align-items-center mb-3">
            <span class="text-warning fs-6"> ★★★★★ </span>

            <span class="ms-2 text-muted small"> 4.8 / 5 </span>
          </div>

          <!-- Price -->
          <div class="mb-2">
            <span class="fs-4 fw-bold text-primary">
              {{ product.price }}
            </span>
          </div>

          <div class="mb-4">
            @if (product.inStock) {
              <span class="badge text-bg-success px-3 py-2"> In Stock </span>
            }

            @else {
              <span class="badge text-bg-danger px-3 py-2"> Out of Stock </span>
            }
          </div>

          <app-cart-button></app-cart-button>
        </div>
      </div>
    </div>
  }

  <div class="d-flex justify-content-between mt-4">

    <button
        class="btn btn-outline-secondary"
        (click)="prev()"
        [disabled]="page==1">
        Previous
    </button>

    <span>Page {{page}}</span>

    <button
        class="btn btn-primary"
        (click)="next()"
        [disabled]="page * pageSize >= filteredProducts.length">
        Next
    </button>

</div>
</div>
