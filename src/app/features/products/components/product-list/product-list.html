<div class="row g-3 p-5">
  @for (product of displayProducts; track product.id) {
    <div class="col-4">
      <div class="card h-100 shadow-sm rounded-4 border border-success">
        <div class="card-body d-flex flex-column" [routerLink]="['/product-details', product.id]" style="cursor: pointer;">
          <!-- Product Name -->
          <h5 class="card-title fw-semibold mb-2">
            {{ product.name }}
          </h5>

          <div class="d-flex align-items-center mb-3">
            <span class="text-warning fs-6"> ★★★★★ </span>

            <span class="ms-2 text-muted small"> 4.8 / 5 </span>
          </div>

          <!-- Price -->
          <div class="mb-2">
            <span class="fs-4 fw-bold text-primary">
              {{ product.price }}
            </span>
          </div>

          <div class="mb-4">
            @if (product.inStock) {
              <span class="badge text-bg-success px-3 py-2"> In Stock </span>

            } @else {
              <span class="badge text-bg-danger px-3 py-2"> Out of Stock </span>
            }
          </div>
        </div>
        <div class="card-footer">
          <app-cart-button
            [product]="product"
          ></app-cart-button>
        </div>
      </div>
    </div>
  }

  <div class="d-flex justify-content-between mt-4">
    <button class="btn btn-outline-secondary" (click)="prev()" [disabled]="page == 1">
      Previous
    </button>

    <span>Page {{ page }}</span>

    <button
      class="btn btn-primary"
      (click)="next()"
      [disabled]="page * pageSize >= filteredProducts.length"
    >
      Next
    </button>
  </div>
</div>
