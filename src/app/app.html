<div class="appContainer">
  <!-- Navbar -->
  <app-navbar> </app-navbar>
  <!-- Navbar end -->

  <!-- 1. Added d-flex, align-items-center, and min-vh-100 to push everything to the vertical center -->
  <main class="container d-flex align-items-center justify-content-center min-vh-100">
    <!-- 2. Added w-100 so the row utilizes full horizontal container width properly -->
    <div class="row w-100">
      <!-- Filter Component (Sidebar) -->
      <div class="col-12 col-md-4 col-lg-3 vertical-divider">
        <div class="row g-4 align-items-end pt-5">
          <!-- Search -->
          <div class="col-lg-12 col-md-6">
            <label class="form-label fw-semibold"> Search Product </label>
            <input type="text" class="form-control" placeholder="Search by product name" />
          </div>

          <!-- Min Price -->
          <div class="col-lg-12">
            <div class="row">
              <div class="col-lg-6 col-md-3">
                <label class="form-label fw-semibold"> Min Price </label>
                <input type="number" class="form-control w-full" placeholder="₹0" />
              </div>
              <!-- Max Price -->
              <div class="col-lg-6 col-md-3">
                <label class="form-label fw-semibold"> Max Price </label>
                <input type="number" class="form-control w-full" placeholder="₹5000" />
              </div>
            </div>
          </div>

          <!-- Sort -->
          <div class="col-lg-12 col-md-6">
            <label class="form-label fw-semibold"> Sort By </label>
            <select class="form-select">
              <option selected>Newest</option>
              <option>Price: Low to High</option>
              <option>Price: High to Low</option>
              <option>Highest Rated</option>
            </select>
          </div>

          <div class="col-lg-12 col-md-6">
            <div class="row align-items-center">
              <div class="col-lg-3">
                <label class="form-label fw-semibold mb-0"> Price Range </label>
              </div>

              <div class="col-lg-9">
                <input type="range" class="form-range" min="0" max="5000" value="2500" />
                <div class="d-flex justify-content-between small text-muted">
                  <span>₹0</span>
                  <span>₹2500</span>
                  <span>₹5000</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <hr class="my-4" />

        <!-- Clear -->
        <div class="col-lg-12 col-md-6 d-grid">
          <button class="btn btn-outline-secondary border-danger">Clear</button>
        </div>
      </div>

      <!-- Product List component -->
      <div class="col-12 col-md-8 col-lg-9 ps-md-4">
        <!-- Your Product List code goes here -->
        <div class="row">
          <div class="col-4">
            <div class="card h-100 border-0 shadow-sm rounded-4">

    <!-- Product Image -->
    <img
        src="https://images.unsplash.com/photo-1609692814858-f7cd2f0afa4f?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        class="card-img-top rounded-top-4"
        alt="Product">

    <div class="card-body d-flex flex-column">

        <!-- Product Name -->
        <h5 class="card-title fw-semibold mb-2">
            Apple AirPods Pro (2nd Gen)
        </h5>

        <!-- Rating -->
        <div class="d-flex align-items-center mb-3">

            <span class="text-warning fs-6">
                ★★★★★
            </span>

            <span class="ms-2 text-muted small">
                4.8 / 5
            </span>

        </div>

        <!-- Price -->
        <div class="mb-2">

            <span class="fs-4 fw-bold text-primary">
                ₹24,999
            </span>

        </div>

        <!-- Stock Status -->
        <div class="mb-4">

            <span class="badge text-bg-success px-3 py-2">
                In Stock
            </span>

            <!-- Out of Stock Example -->
            <!--
            <span class="badge text-bg-danger px-3 py-2">
                Out of Stock
            </span>
            -->

        </div>

        <!-- Button -->
        <button class="btn btn-primary w-100 mt-auto">
            Add to Cart
        </button>

    </div>
